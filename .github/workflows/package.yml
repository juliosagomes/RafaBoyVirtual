name: Empacotar extensão

# Gera o .zip para a Chrome Web Store a cada push e pull request.
# Ao criar uma tag "vX.Y.Z", publica também um Release no GitHub com o .zip anexado.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar pdftotext (verifica o texto dos PDFs nos testes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Testes
        run: npm test

      - name: Validar e empacotar
        run: npm run package

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão do manifest (v$VERSION)"
            exit 1
          fi

      - name: Guardar o .zip
        uses: actions/upload-artifact@v4
        with:
          name: rafaboy-virtual
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rafaboy-virtual
          path: dist

      - name: Publicar Release com o .zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "RafaBoy Virtual $GITHUB_REF_NAME" \
            --notes "Pacote para enviar à Chrome Web Store: baixe o .zip abaixo e envie em Painel do desenvolvedor → Pacote → Enviar novo pacote."
